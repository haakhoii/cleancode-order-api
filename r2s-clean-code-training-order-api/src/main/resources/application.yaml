server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

  cloud:
    openfeign:
      client:
        config:
          notification-service:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:3000}
            read-timeout: ${FEIGN_READ_TIMEOUT:5000}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

logging:
  level:
    root: INFO
    vn.r2s.training: INFO

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8081}

app:
  kafka:
    topic:
      order-notification: ${KAFKA_TOPIC_ORDER_NOTIFICATION:order.notification}
  security:
    permit-all: false

resilience4j:
  circuitbreaker:
    instances:
      notificationService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

  retry:
    instances:
      notificationService:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - feign.FeignException.FeignServerException
        ignore-exceptions:
          - feign.FeignException.FeignClientException